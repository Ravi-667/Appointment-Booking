# =============================================================================
# GitHub Actions CI Pipeline
# =============================================================================
# Triggers: push to any branch, pull_request
# Jobs: test (lint, unit tests with coverage, e2e tests), build (docker image)
# Requires secrets in GitHub:
#   - DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (for pushing images)
#   - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (for ECR deployment)
# =============================================================================

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main', 'develop']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Prisma generate
        run: npx prisma generate

      - name: Run unit tests with coverage
        run: npm run test:cov --if-present
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Run e2e tests
        run: npm run test:e2e --if-present
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/booking_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/appointment-booking-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/appointment-booking-api:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/appointment-booking-api:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/appointment-booking-api:buildcache,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.worker
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/appointment-booking-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/appointment-booking-worker:${{ github.sha }}

      - name: Build and push Analytics image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.analytics
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/appointment-booking-analytics:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/appointment-booking-analytics:${{ github.sha }}
