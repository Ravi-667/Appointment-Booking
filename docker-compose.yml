# =============================================================================
# docker-compose.yml — Appointment Booking Platform (Local Development)
# =============================================================================
#
# Prerequisites: Docker Desktop / Docker Engine + Docker Compose v2 installed
#                (Docker Desktop bundles both). Verify with:
#
#                  docker compose version        # must show v2.x
#
# Start all services:
#
#                  docker compose up -d
#
# Stop everything:
#
#                  docker compose down --volumes   # removes DB data too
#                  docker compose down           # keeps DB data
#
# Views logs:
#
#                  docker compose logs -f
#
# Restart a single service:
#
#                  docker compose restart api
#
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 15 — Primary Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: booking_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: booking_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: auto-load extra SQL on first start
      # - ./docker/init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d booking_dev']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - booking-net

  # --------------------------------------------------------------------------
  # Redis 7 — Cache / Rate Limiting / Locks / BullMQ
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: booking_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - booking-net

  # --------------------------------------------------------------------------
  # Zookeeper — Kafka dependency
  # --------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: booking_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ['CMD', 'sh', '-c', 'echo stat | nc localhost 2181 | grep -q "Zookeeper version"']
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - booking-net

  # --------------------------------------------------------------------------
  # Kafka 7.5
  # --------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: booking_kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ['CMD', 'sh', '-c', 'kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 15s
      timeout: 15s
      retries: 5
    networks:
      - booking-net

  # --------------------------------------------------------------------------
  # MailHog — Fake SMTP for local development (view emails at http://localhost:8025)
  # --------------------------------------------------------------------------
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: booking_mailhog
    ports:
      - '1025:1025'   # SMTP server
      - '8025:8025'   # Web UI
    healthcheck:
      test: ['CMD', 'nc', '-z', 'localhost', '1025']
      interval: 10s
      timeout: 10s
      retries: 3
    networks:
      - booking-net

  # --------------------------------------------------------------------------
  # API — Node.js Express application
  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: development
    container_name: booking_api
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/booking_dev
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=kafka:9092
      - SMTP_HOST=mailhog
      - SMTP_PORT=1025
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    ports:
      - '3000:3000'
    volumes:
      # Mount source for hot-reload during development
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - booking-net
    command: /bin/sh -c "npx prisma generate && npm run dev"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  booking-net:
    driver: bridge
